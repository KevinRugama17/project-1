<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartel de extintor</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="cartel">
    <h1 class="titulo">EXTINTOR</h1>
    <p class="subtitulo">USELO UNICAMENTE EN FUEGO CLASE</p>

    <!-- Triángulo verde con la letra A -->
    <svg class="clase-a" viewBox="0 0 100 90" role="img" aria-label="Clase A">
      <polygon points="50,8 93,82 7,82" fill="#fff" stroke="#1b7a2e" stroke-width="9" stroke-linejoin="round"/>
      <text x="50" y="72" text-anchor="middle" font-size="50" font-weight="900" font-family="Arial Black, Arial, sans-serif" fill="#1b7a2e">A</text>
    </svg>

    <!-- Icono azul: al pasar el mouse suena la alarma -->
    <button class="icono-azul" type="button" aria-label="Sólidos combustibles. Pasa el mouse para oír la alarma">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="12" fill="#1d3fa8"/>
        <!-- Basurero -->
        <rect x="16" y="34" width="32" height="7" rx="2" fill="#fff"/>
        <path d="M19 43h26l-3 40H22z" fill="#fff"/>
        <!-- Llamas del basurero -->
        <path d="M20 32c-6-7 1-12-1-19 7 3 10 9 6 14 3-1 4-4 4-7 5 5 3 11-1 12z" fill="#fff"/>
        <!-- Fogata -->
        <path d="M66 72c-12-9-5-22 4-32 0 8 6 9 8 15 2-4 1-9-2-13 11 6 15 19 6 30z" fill="#fff"/>
        <rect x="56" y="76" width="32" height="7" rx="3" fill="#fff" transform="rotate(-14 72 80)"/>
        <rect x="56" y="76" width="32" height="7" rx="3" fill="#fff" transform="rotate(14 72 80)"/>
      </svg>
    </button>

    <p class="solidos">SOLIDOS COMBUSTIBLES</p>
    <p class="ejemplos">madera, papel,<br>tela, basura<br>cartones</p>

    <h2 class="metodo">METODO PARA UTILIZARLO</h2>
    <ol class="pasos">
      <li>Sosténgalo en posición vertical.</li>
      <li>Retire el seguro.</li>
      <li>Oprima la palanca.</li>
      <li>Dirija la descarga contra la base de la llama.</li>
    </ol>

    <div class="franjas"></div>
  </main>
</body>
</html>
